version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: twitter-clone-mongodb-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backups:/backup
    networks:
      - twitter-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: twitter-clone-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - twitter-network-prod
    restart: unless-stopped

  backend:
    image: ${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/twitter-clone-backend:${TAG}
    container_name: twitter-clone-backend-prod
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
    depends_on:
      - mongodb
      - redis
    networks:
      - twitter-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/twitter-clone-frontend:${TAG}
    container_name: twitter-clone-frontend-prod
    depends_on:
      - backend
    networks:
      - twitter-network-prod
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: twitter-clone-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - twitter-network-prod
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  twitter-network-prod:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
        